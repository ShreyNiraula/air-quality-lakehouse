name: Notify the owner

# GitHub does not notify people about their own account's actions, and the
# pull requests here are opened and labelled from the owner's account. A
# mention from the workflow's own account does notify them. The label is
# added only at the handover, so this is the one email per pull request
# that means "your turn".
on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  notify:
    if: github.event.label.name == 'ready-for-final-review'
    runs-on: ubuntu-latest
    steps:
      - name: Mention the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: gh pr comment "$PR" --body "@$OWNER Ready for your final review. Claude and Codex have finished with this pull request, and it will not change again unless you comment on it."
