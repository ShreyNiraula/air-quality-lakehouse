name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the size report compares the branch with main
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: Report the pull request size
        if: github.event_name == 'pull_request'
        # Exit code 1 means over the limit, which is reported and left to the reviewer.
        run: |
          status=0
          .github/scripts/pr-size.sh "origin/$GITHUB_BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          [ "$status" -le 1 ]
