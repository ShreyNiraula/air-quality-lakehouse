# The dbt project of the platform. Task 1.2 starts it with its two seeds, the vocabulary and the
# registry, and task 1.15a adds the station, sensor and datastream tables built from them.
# `make seeds` loads the seeds, builds the tables and runs every test.
name: airquality
version: "1.0"
profile: airquality
seed-paths: [seeds]
model-paths: [models]
test-paths: [tests]
models:
  airquality:
    +materialized: table
flags:
  send_anonymous_usage_stats: false

seeds:
  airquality:
    parameter:
      # Read as numbers with a fraction, so that 15 and 37.5 are the same kind of value.
      +column_types: {valid_min: double, valid_max: double, guideline_value: double}
    registry:
      # Ids are text: an openSenseMap box id is not a number, and an OpenAQ id only looks like one.
      +column_types:
        {station_id: varchar, sensor_id: varchar, latitude: double, longitude: double,
         start_date: date}
